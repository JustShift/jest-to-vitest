name: Release

on:
  push:
    tags:
      - 'v*'

# Uses npm Trusted Publishing (OIDC). No NPM_TOKEN secret required.
# Configure once on npmjs.com → @shiftkit/jest-to-vitest → Settings →
# Trusted Publishing → Add → GitHub Actions → repo JustShift/jest-to-vitest,
# workflow file release.yml, environment (none).

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # OIDC Trusted Publishing requires npm >= 11.5.1; Node 22 ships with npm 10.x.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm run build
      # --provenance forces npm CLI to request the OIDC token from GitHub Actions.
      - run: npm publish --provenance --access public
